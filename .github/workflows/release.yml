name: Publish portable release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve release version
        shell: pwsh
        run: |
          $props=[xml](Get-Content Directory.Build.props -Raw)
          $version=[string]$props.Project.PropertyGroup.InformationalVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(?:RC\d*)?$') { throw 'Invalid release version' }
          $tag="v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and product version differ' }
          if (!(Test-Path "docs/RELEASE_$tag.md")) { throw 'Release notes missing' }
          "RELEASE_VERSION=$version" | Add-Content $env:GITHUB_ENV
          "RELEASE_TAG=$tag" | Add-Content $env:GITHUB_ENV
          $display=$version -replace '^(\d+\.\d+)\.0(RC\d*)$','$1$2'
          "RELEASE_DISPLAY_VERSION=$display" | Add-Content $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/Test-NativeProvenance.ps1
          ./scripts/Test-NativeComponents.ps1
          ./scripts/Test-ReShadeIni.ps1
          ./scripts/Test-ReleasePayloadMerge.ps1
          dotnet run --project tests/Activation.ListenerTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Activation listener tests failed' }
          dotnet run --project tests/WuWaFpsUnlock.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          dotnet run --project tests/Deployment.CleanupTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup preflight tests failed' }
          dotnet run --project tests/MenuShortcut.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Menu shortcut tests failed' }
          dotnet run --project tests/EmbeddedDynamicAddon.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Embedded companion tests failed' }
          dotnet run --project tests/DynamicMultiplier.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Dynamic multiplier configuration tests failed' }
          dotnet run --project tests/Dynamic.SettingsTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Dynamic settings tests failed' }
          dotnet run --project tests/Update.ServiceTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Update service tests failed' }
          dotnet run --project tests/Update.PreferenceTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Update preference tests failed' }
          dotnet run --project tests/Update.DialogLayoutTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'WPF layout tests failed' }
          dotnet run --project tests/Rollback.CatalogTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Rollback backup tests failed' }
          dotnet run --project tests/Update.DeferredSessionTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Deferred update tests failed' }
          dotnet run --project tests/Update.ExitObservationTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Session exit tests failed' }
          dotnet run --project tests/Startup.RefreshTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Startup refresh tests failed' }
          dotnet run --project tests/Official.LaunchOptionsTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Official launch option tests failed' }
          dotnet run --project tests/Official.PredownloadTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Official predownload tests failed' }
          dotnet run --project tests/ResourceTier.UiTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Resource tier UI tests failed' }
          dotnet run --project tests/PeInspector.PerformanceTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Proxy inspection regression failed' }
          dotnet run --project tests/Rollback.ResourceTests -c Release -- src/WuWaFpsUnlock/obj/embedded-updater/Release/WuWaUpdater.exe
          if ($LASTEXITCODE -ne 0) { throw 'Embedded rollback worker tests failed' }
          ./tools/OfflineUpdater.IntegrationTests/Run.ps1
          dotnet publish src/WuWaFpsUnlock -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          dotnet publish tools/OfflineUpdater -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o updater-build
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed' }
          & ./updater-build/WuWaUpdater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
      - name: Package compatible release assets
        shell: pwsh
        run: ./scripts/Build-ReleasePackages.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            WuWaFPSUnlock-*.zip
            SHA256SUMS.txt
      - name: Upload and publish
        shell: pwsh
        run: |
          $tag=$env:RELEASE_TAG
          $version=$env:RELEASE_VERSION
          $draft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Published release exists; refusing to overwrite assets.' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "鸣潮 FPS Unlock v$env:RELEASE_DISPLAY_VERSION" --notes-file "docs/RELEASE_$tag.md"
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "鸣潮 FPS Unlock v$env:RELEASE_DISPLAY_VERSION" --notes-file "docs/RELEASE_$tag.md" --draft
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          gh release upload $tag "WuWaFPSUnlock-$version-win-x64.zip" "WuWaFPSUnlock-$version-update.zip" SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; draft retained' }
          if ($version -match 'RC') {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
