name: Windows build and core tests
on: [workflow_dispatch, push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native source inventories and isolated C++ tests
        shell: pwsh
        run: |
          ./scripts/Test-NativeProvenance.ps1
          ./scripts/Test-NativeComponents.ps1
          ./scripts/Test-ReShadeIni.ps1
          ./scripts/Test-ReleasePayloadMerge.ps1
      - name: Single-instance pipe recovery
        run: dotnet run --project tests/Activation.ListenerTests -c Release
      - name: Core tests (no game or injected process)
        run: dotnet run --project tests/WuWaFpsUnlock.Tests -c Release
      - name: FPS channel, process identity and native WPF state
        shell: pwsh
        run: |
          foreach ($project in @('Fps.ChannelTests','FpsIdentity.Tests','UiRendering.Wpf')) {
            dotnet run --project "tests/$project" -c Release
            if ($LASTEXITCODE -ne 0) { throw "FPS regression failed: $project" }
          }
      - name: Cleanup preflight and filesystem regression
        run: dotnet run --project tests/Deployment.CleanupTests -c Release
      - name: Menu shortcut configuration and guarded writes
        run: dotnet run --project tests/MenuShortcut.Tests -c Release
      - name: Official resource metadata and background startup recovery
        shell: pwsh
        run: |
          foreach($project in @('Official.LaunchOptionsTests','Official.PredownloadTests','Startup.RefreshTests','ResourceTier.UiTests','DynamicMultiplier.Tests','Dynamic.SettingsTests')) {
            dotnet run --project "tests/$project" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $project" }
          }
      - name: Update protocol and fake HTTP tests
        run: dotnet run --project tests/Update.ServiceTests -c Release
      - name: Update preference persistence tests
        run: dotnet run --project tests/Update.PreferenceTests -c Release
      - name: Embedded Dynamic companion deployment planning
        run: dotnet run --project tests/EmbeddedDynamicAddon.Tests -c Release
      - name: Update dialog and settings WPF layout
        run: dotnet run --project tests/Update.DialogLayoutTests -c Release
      - name: Rollback backup discovery
        run: dotnet run --project tests/Rollback.CatalogTests -c Release
      - name: Update and rollback process handoff
        shell: pwsh
        run: ./tools/OfflineUpdater.IntegrationTests/Run.ps1
      - name: Deferred update session lifecycle
        run: dotnet run --project tests/Update.DeferredSessionTests -c Release
      - name: Successful and failed session exit behavior
        run: dotnet run --project tests/Update.ExitObservationTests -c Release
      - name: Compile WPF and publish
        run: dotnet publish src/WuWaFpsUnlock -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o artifacts/current/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: WuWaFpsUnlock-win-x64-unvalidated
          path: artifacts/current/win-x64/
