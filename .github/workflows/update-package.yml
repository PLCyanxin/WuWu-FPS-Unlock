name: Build standalone updater
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test updater
        shell: pwsh
        run: |
          dotnet publish tools/OfflineUpdater -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o updater-build
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed' }
          & ./updater-build/WuWaUpdater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-updater
          path: updater-build/WuWaUpdater.exe
